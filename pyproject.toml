[project]
name = "mcp-radar-experiments"
version = "0.1.0"
description = "Incubating developer-tool experiments, including the Hermes Exec Fuse plugin."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agentpixelated" }]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_hermes_exec_fuse.py" = ["E402"]
